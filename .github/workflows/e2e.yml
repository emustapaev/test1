name: E2E

# E2E и Lighthouse идут против статического экспорта apps/web/out
# (POST /contact мокается через page.route), прод не затрагивается.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_LEAD_API_URL: http://localhost:4010/contact
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test -c e2e
      - name: Lighthouse (Performance/Accessibility/SEO ≥ 90)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-reports
          path: |
            e2e/playwright-report
            e2e/test-results
            .lighthouseci
