name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web -w apps/api

      - name: Typecheck
        run: npm run typecheck -w apps/web

      - name: Check i18n keys
        run: npm run check:i18n -w apps/web

      - name: Test API
        run: npm test -w apps/api

      - name: Test edge function
        # shell-раскрытие glob работает на любой версии Node
        run: node --test infra/functions/*.test.mjs

      - name: Build web
        run: npm run build -w apps/web

      - name: Build API
        run: npm run build -w apps/api

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          if-no-files-found: error
