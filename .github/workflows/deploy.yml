name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: долгоживущих AWS-ключей нет, роль берётся через AWS_DEPLOY_ROLE_ARN
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_enable_custom_domain: ${{ vars.ENABLE_CUSTOM_DOMAIN }}
  TF_VAR_canonical_host: ${{ vars.CANONICAL_HOST }}
  TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
  TF_IN_AUTOMATION: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w apps/web -w apps/api

      - name: Test
        run: |
          npm test -w apps/api
          node --test infra/functions/*.test.mjs scripts/dns/render-table.test.mjs

      - name: Build web
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ vars.CANONICAL_HOST }}
        run: npm run build -w apps/web

      - name: Build API bundle
        run: npm run build -w apps/api

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=site/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # Этап 1 (ENABLE_CUSTOM_DOMAIN=false): ожидания валидации ACM нет, apply завершается сразу.
      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve

      - name: Terraform outputs
        working-directory: infra/terraform
        run: terraform output -json > "$RUNNER_TEMP/outputs.json"

      - name: Sync site to S3
        run: |
          BUCKET=$(jq -r '.site_bucket_name.value' "$RUNNER_TEMP/outputs.json")
          # Ассеты с хешами в имени — immutable; HTML — всегда ревалидируется
          aws s3 sync apps/web/out "s3://${BUCKET}" --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/web/out "s3://${BUCKET}" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          DIST=$(jq -r '.cloudfront_distribution_id.value' "$RUNNER_TEMP/outputs.json")
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      - name: Render DNS table
        env:
          CANONICAL_HOST: ${{ vars.CANONICAL_HOST }}
        run: |
          CANONICAL=apex
          if [ "$CANONICAL_HOST" = "www.krunai.uz" ]; then CANONICAL=www; fi
          mkdir -p dns-table
          node scripts/dns/render-table.mjs "$RUNNER_TEMP/outputs.json" \
            --baseline docs/dns/baseline.txt --canonical "$CANONICAL" > dns-table/dns-table.md
          {
            echo "## DNS-записи для клиента"
            echo
            cat dns-table/dns-table.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DNS table
        uses: actions/upload-artifact@v4
        with:
          name: dns-table
          path: dns-table/dns-table.md
          if-no-files-found: error
