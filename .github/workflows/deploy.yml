name: Deploy

# Только тег release-*: его ставит платформа после подтверждения клиента (docs/platform-contract.md)
on:
  push:
    tags: ["release-*"]

# OIDC: долгоживущих AWS-ключей нет, роль берётся через AWS_DEPLOY_ROLE_ARN
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TF_VAR_permissions_boundary_arn: ${{ vars.AWS_PERMISSIONS_BOUNDARY_ARN }}
  TF_VAR_enable_custom_domain: ${{ vars.KRUNAI_ENABLE_CUSTOM_DOMAIN || 'false' }}
  TF_IN_AUTOMATION: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      # Те же проверки, что в CI
      - name: Lint web
        run: npm run lint -w apps/web

      - name: Check i18n keys
        run: node apps/web/scripts/check-i18n.mjs

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: apps/api
        run: ruff check .

      - name: Pytest
        working-directory: apps/api
        run: pytest

      - name: Test CloudFront Function and deploy scripts
        run: node --test infra/functions/*.test.mjs scripts/deploy/*.test.mjs

      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: OpenAPI lint
        run: npx --yes @redocly/cli lint contracts/openapi.yaml

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="key=test1/terraform.tfstate" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      # Этап 1 (KRUNAI_ENABLE_CUSTOM_DOMAIN=false): ожидания валидации ACM нет, apply завершается сразу.
      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -input=false -auto-approve

      - name: Terraform outputs
        working-directory: infra/terraform
        run: terraform output -json > "$RUNNER_TEMP/outputs.json"

      - name: Build web
        run: |
          API=$(jq -r '.api_endpoint.value' "$RUNNER_TEMP/outputs.json")
          export NEXT_PUBLIC_LEAD_API_URL="${API}/contact"
          npm run build -w apps/web

      - name: Sync site to S3
        run: |
          BUCKET=$(jq -r '.site_bucket_name.value' "$RUNNER_TEMP/outputs.json")
          # Ассеты с хешами в имени — immutable; HTML — всегда ревалидируется
          aws s3 sync apps/web/out "s3://${BUCKET}" --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync apps/web/out "s3://${BUCKET}" --delete \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          DIST=$(jq -r '.cloudfront_distribution_id.value' "$RUNNER_TEMP/outputs.json")
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"

      # Критерии приёмки ТЗ v5 (разд. 2): без отправки реальных писем
      - name: Post-deploy smoke
        run: |
          export SITE_URL=$(jq -r '.site_url.value' "$RUNNER_TEMP/outputs.json")
          export API_ENDPOINT=$(jq -r '.api_endpoint.value' "$RUNNER_TEMP/outputs.json")
          export SITE_BUCKET=$(jq -r '.site_bucket_name.value' "$RUNNER_TEMP/outputs.json")
          export CUSTOM_DOMAIN_ENABLED="${TF_VAR_enable_custom_domain}"
          export AWS_REGION="${{ vars.AWS_REGION }}"
          bash scripts/smoke/post-deploy.sh

      - name: Build handoff
        run: node scripts/deploy/build-handoff.mjs "$RUNNER_TEMP/outputs.json" handoff.json

      - name: Upload client-handoff
        uses: actions/upload-artifact@v4
        with:
          name: client-handoff
          path: handoff.json
          if-no-files-found: error
