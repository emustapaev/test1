openapi: 3.1.0
info:
  title: krunai.uz Contact API
  version: 2.0.0
  description: |
    Contact form endpoint for krunai.uz (API Gateway HTTP API, `$default`
    stage, backed by a Python Lambda that sends the email via SES). The server
    never returns localized or human-readable messages: errors are
    machine-readable codes, and the frontend maps them to localized text
    (see docs/architecture.md). No submissions are stored.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{apiId}.execute-api.eu-west-3.amazonaws.com
    description: API Gateway invoke URL (Terraform output `api_endpoint`)
    variables:
      apiId:
        default: example
        description: API Gateway HTTP API id.
tags:
  - name: contact
    description: Contact form submission
paths:
  /contact:
    post:
      tags: [contact]
      operationId: createContact
      security: []
      summary: Submit the contact form
      description: |
        Validates the payload and sends a notification email. If the honeypot
        field `website` is non-empty, the server returns 200 and sends nothing
        (silent success). CR/LF in `name` or `email` is rejected with
        `invalid_format` (header injection protection). Rate limiting is done
        only by API Gateway stage throttling; exceeding it returns 429 whose
        body is generated by API Gateway and is not guaranteed. CORS allows
        only https://krunai.uz (and localhost for development).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactRequest'
            examples:
              ru:
                summary: Valid request from the RU page
                value:
                  name: Ivan
                  email: ivan@example.com
                  message: Hello, I would like to discuss a project.
                  lang: ru
                  website: ''
      responses:
        '200':
          description: Request accepted (also returned when the honeypot is filled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
              examples:
                ok:
                  value:
                    ok: true
        '400':
          description: Malformed JSON or validation failure.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/BadRequestResponse'
              examples:
                validation:
                  summary: Field validation failed
                  value:
                    error: validation_error
                    fields:
                      email: invalid_format
                      message: required
                badLang:
                  summary: Language outside the allow-list
                  value:
                    error: validation_error
                    fields:
                      lang: invalid_value
                badJson:
                  summary: Body is not valid JSON
                  value:
                    error: bad_request
        '429':
          description: |
            Throttled by API Gateway (stage throttling). The response body is
            produced by API Gateway and is not guaranteed; clients must rely
            on the status code only.
        '500':
          description: Unexpected server failure (including email delivery failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorResponse'
              examples:
                internal:
                  value:
                    error: internal_error
components:
  schemas:
    ContactRequest:
      type: object
      additionalProperties: false
      required: [name, email, message, lang, website]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Must not contain CR or LF (otherwise `invalid_format`).
        email:
          type: string
          format: email
          maxLength: 254
          description: Must not contain CR or LF (otherwise `invalid_format`).
        message:
          type: string
          minLength: 1
          maxLength: 5000
        lang:
          description: |
            Language of the page the form was sent from. A value outside the
            allow-list is rejected with `fields.lang = invalid_value`.
          type: string
          enum: [en, ru]
        website:
          type: string
          description: Honeypot. Must be empty; real users never see it.
          maxLength: 0
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
    FieldErrorCode:
      type: string
      description: Per-field validation error code.
      enum: [required, invalid_format, too_long, invalid_value]
    ValidationErrorResponse:
      type: object
      required: [error, fields]
      properties:
        error:
          type: string
          const: validation_error
        fields:
          type: object
          description: Map of invalid field name to error code.
          minProperties: 1
          propertyNames:
            enum: [name, email, message, lang]
          additionalProperties:
            $ref: '#/components/schemas/FieldErrorCode'
    BadRequestResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          const: bad_request
    InternalErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          const: internal_error
