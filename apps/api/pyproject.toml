[project]
name = "krunai-api"
version = "2.0.0"
description = "krunai.uz contact form Lambda (Python 3.12, API Gateway HTTP API -> SES v2)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
